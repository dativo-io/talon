name: Install Smoke

# The customer's installation path against a PUBLISHED release (#359). Job
# `install-smoke`: a
# clean runner with no Go, no Docker, anonymous downloads and no checkout
# beyond the two scripts it runs — scripts/verify-release.sh (public assets, every
# digest, the executable's version and commit against the tag, the showcase
# manifest's talon entry, the bundle, the anonymous image pulls) and
# scripts/install.sh under `sh` (the documented `curl … | sh`), installed into
# a scratch directory and compared byte for byte with the verified executable.
#
# Manual: `gh workflow run install-smoke.yml -f tag=v1.16.0` (default:
# `releases/latest`). It changes nothing anywhere; a FAIL is the honest state
# of that release (v1.15.0–v1.15.3 fail on the manifest's missing talon
# entry, #507). The release workflow runs the same verifier before and after
# publication; this workflow re-runs it on demand, from the customer's side.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to verify (default: the latest published release)"
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  install-smoke:
    name: Verify and install the published release (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/verify-release.sh
            scripts/install.sh
          sparse-checkout-cone-mode: false
      - name: Verify the published assets and install with install.sh (no Go, anonymous downloads)
        env:
          TAG: ${{ inputs.tag || 'latest' }}
          # Metadata reads only (release state, the tag's commit): anonymous
          # api.github.com calls from shared runner IPs are rate-limited. Asset
          # downloads, registry pulls and the installer's download stay
          # anonymous, exactly as a customer's.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify"
          env -u GOROOT PATH="/usr/bin:/bin" bash scripts/verify-release.sh --tag "$TAG" \
            --work-dir "$RUNNER_TEMP/verify" --install "$RUNNER_TEMP/verify/install" --all-archives \
            --summary-json "$RUNNER_TEMP/verify/summary.json" | tee "$RUNNER_TEMP/verify/verify.log"
          { echo '### Published release verification'; echo '```'; sed -n '/^verify-release summary/,$p' "$RUNNER_TEMP/verify/verify.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Installed binary runs
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/verify/install/talon" version
          "$RUNNER_TEMP/verify/install/talon" --help >/dev/null
      - name: Keep the verdict
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$RUNNER_TEMP/verify/verify.log" "$RUNNER_TEMP/verify/summary.json" artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-smoke-${{ inputs.tag || 'latest' }}
          path: artifacts
          if-no-files-found: ignore

  # The published image serves the paired read-only operations console over a
  # clean Compose installation (#533 release acceptance): the stack and the
  # smoke come from the release's own tag, the Talon image is pulled
  # anonymously from GHCR (no login step in this job), and only the mock
  # provider is built. Releases before the one that added TALON_IMAGE to
  # examples/docker-compose cannot run this job.
  console-compose:
    name: Operations console from the published image (Compose, pairing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || 'latest' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$TAG" = latest ]; then TAG="$(gh release view --json tagName -q .tagName)"; fi
          [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = false ] || { echo "::error::$TAG is not a published release"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
          sparse-checkout: |
            examples/docker-compose
            scripts/console-compose-smoke.sh
          sparse-checkout-cone-mode: false
      - name: Pair with the console of the published image and read the installation
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          TALON_IMAGE="ghcr.io/dativo-io/talon:${VERSION}" TALON_PULL_POLICY=always TALON_EXPECT_VERSION="$VERSION" \
            bash scripts/console-compose-smoke.sh 2>&1 | tee console-compose.log
          { echo "### Operations console from ghcr.io/dativo-io/talon:${VERSION}"; echo '```'; grep -E '^(PASS|FAIL)' console-compose.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Operations Console acceptance on the PUBLISHED executable (#533): the
  # release archive is downloaded anonymously and checksum-verified, then the
  # browser suite, the People Analytics real-process contract (#545) and the
  # console e2e run with it as the system under test. The checkout is the
  # release's own tag.
  console-acceptance:
    name: Console acceptance on the published binary (browser, People Analytics)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || 'latest' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$TAG" = latest ]; then TAG="$(gh release view --json tagName -q .tagName)"; fi
          [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = false ] || { echo "::error::$TAG is not a published release"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the published archive anonymously and verify it
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ARCHIVE="talon_${VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p "$RUNNER_TEMP/assets" "$RUNNER_TEMP/talon"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/assets/$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/assets/checksums.txt" "$BASE/checksums.txt"
          (cd "$RUNNER_TEMP/assets" && grep -F " $ARCHIVE" checksums.txt | sha256sum -c -)
          tar -C "$RUNNER_TEMP/talon" -xzf "$RUNNER_TEMP/assets/$ARCHIVE" talon
      - name: Install Playwright (pinned) and Chromium
        working-directory: tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser suite, People Analytics (#545) and console e2e on the published binary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/published-console-acceptance.sh "$RUNNER_TEMP/talon/talon" "$TAG" 2>&1 | tee console-acceptance.log
          { echo "### Console acceptance on the published ${TAG} binary"; echo '```'; grep -E '^(binary under test|== |PASS|FAIL|ok )|passed|failed' console-acceptance.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The exact command the quickstart advertises (#463, #473), from a runner
  # with no checkout at all: the script is fetched from the release's tag,
  # the image is pulled anonymously, and the elapsed time is recorded.
  quickstart:
    name: Published-image quickstart (no clone, no provider, no key)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || 'latest' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$TAG" = latest ]; then TAG="$(gh release view --json tagName -q .tagName)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: curl … | TALON_VERSION=<version> bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/scripts/quickstart.sh" | TALON_VERSION="${TAG#v}" bash 2>&1 | tee quickstart.log
          grep -q '^PASS talon quickstart' quickstart.log
          { echo "### Quickstart against ${TAG}"; echo '```'; grep -E '^(PASS|FAIL|Image|Digest|Talon)' quickstart.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
