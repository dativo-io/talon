name: Release

# Release pipeline (#507): build → verify → publish. GoReleaser creates the
# release as a DRAFT (invisible to `releases/latest`, the installer and
# anonymous downloads); the showcase bundle and the darwin archives are added
# to the draft; `release-verify` downloads every asset from the draft, checks
# every digest, runs the customer path (the published bundle + the published
# talon binary + the published manifest, no checkout) and only then publishes
# the release and moves the Docker `latest`/`<major>.<minor>` tags. A failed
# verification leaves a draft, never a public broken release. A published
# release is never touched again (scripts/release-guard.sh); with GitHub's
# immutable releases enabled on the repository, publication also locks the
# assets and attaches provenance attestations.
#
# workflow_dispatch with `tag` re-runs ONLY the verification against an
# already published release (audit mode: nothing is uploaded, published or
# retagged) — the same checks a customer can run, from the public assets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to re-verify (audit only; e.g. v1.15.4)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # A tag whose release is already published is never built or uploaded
  # again: published assets stay what customers downloaded. Re-runs are
  # allowed only while the release is still a draft.
  guard:
    name: Refuse to touch a published release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The tag's release must be absent or still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release-guard.sh "$RELEASE_TAG"

  release:
    name: Release (draft)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser (via goreleaser-cross image) builds the linux/amd64 archive,
      # pushes the VERSION-tagged Docker images and creates the DRAFT release
      # with release notes. Darwin archives are NOT built here — CGO
      # (mattn/go-sqlite3) cross-compilation via osxcross has been unreliable
      # (#326) — they come from the native macOS job below (#359). The movable
      # image tags are applied by release-verify after publication.
      - name: Run GoReleaser (linux + docker, draft release)
        run: |
          docker run --rm --privileged \
            -v $PWD:/work -w /work \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.docker:/root/.docker \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e CGO_ENABLED=1 \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.10 \
            release --clean

  # OpenShell showcase bundle (#482/#463/#507): the canonical runner, its
  # helpers and a sha256 manifest naming the pinned agent image AND the digest
  # of the talon binary this release ships — read back from the archive
  # goreleaser just uploaded to the draft, never rebuilt here (a rebuilt
  # binary would not match the release). The runner refuses any binary whose
  # digest is not in the manifest, talon included.
  release-showcase-bundle:
    name: OpenShell showcase bundle
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download the released talon archive from the draft and verify it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="talon_${VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/assets" "$RUNNER_TEMP/talon"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/assets" -p "$ARCHIVE" -p checksums.txt
          (cd "$RUNNER_TEMP/assets" && grep -F " $ARCHIVE" checksums.txt | sha256sum -c -)
          tar -C "$RUNNER_TEMP/talon" -xzf "$RUNNER_TEMP/assets/$ARCHIVE" talon
          "$RUNNER_TEMP/talon/talon" version
          echo "TALON_BIN=$RUNNER_TEMP/talon/talon" >> "$GITHUB_ENV"
          echo "TALON_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Build the bundle around the released binary
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          TALON_SHOWCASE_BUNDLE_RELEASE=1 bash scripts/build-showcase-bundle.sh "$VERSION" dist \
            "ghcr.io/dativo-io/talon-openshell-agent:${VERSION}" "$TALON_BIN" "$TALON_ARCHIVE"
          jq -e '.artifacts.talon.sha256 | length == 64' dist/talon-openshell-showcase_*.manifest.json
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/release-guard.sh "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/talon-openshell-showcase_*.tar.gz dist/talon-openshell-showcase_*.tar.gz.sha256 dist/talon-openshell-showcase_*.manifest.json --clobber

  # Darwin binaries (#359): built natively on a macOS runner because the
  # evidence store is CGO (mattn/go-sqlite3) — Apple clang builds both
  # arm64 and amd64 (-arch x86_64) without osxcross. Uploaded to the draft;
  # release-verify gates publication on them (checksum parity, #359).
  release-darwin:
    name: Darwin binaries (${{ matrix.arch }})
    needs: release
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package (darwin/${{ matrix.arch }})
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags "-s -w \
            -X github.com/dativo-io/talon/internal/cmd.Version=${VERSION} \
            -X github.com/dativo-io/talon/internal/cmd.Commit=${COMMIT} \
            -X github.com/dativo-io/talon/internal/cmd.BuildDate=${DATE}" \
            -o talon ./cmd/talon
          # Smoke-run only the native arch (amd64 on the arm64 runner would
          # need Rosetta); the cross build is still verified by `file`.
          if [ "${{ matrix.arch }}" = "$(uname -m | sed 's/x86_64/amd64/')" ]; then ./talon version; fi
          file talon
          ARCHIVE="talon_${VERSION}_darwin_${{ matrix.arch }}.tar.gz"
          tar -czf "${ARCHIVE}" talon LICENSE README.md CHANGELOG.md
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/release-guard.sh "$RELEASE_TAG"
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="talon_${VERSION}_darwin_${{ matrix.arch }}.tar.gz"
          gh release upload "$RELEASE_TAG" "${ARCHIVE}" "${ARCHIVE}.sha256" --clobber

  # Publication gate (#507): everything a customer downloads is verified from
  # the draft — digests, the talon binary's version, the manifest's talon
  # entry, and the showcase customer path end to end (bundle + manifest +
  # released talon, no checkout, real OpenShell sandbox) — before the release
  # is published. In audit mode (workflow_dispatch) the same checks run
  # against a published release and nothing is changed.
  release-verify:
    name: Verify from the release, then publish
    needs: [release-showcase-bundle, release-darwin]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.release-showcase-bundle.result == 'success' && needs.release-darwin.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download every asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/assets"
          ls -l "$RUNNER_TEMP/assets"
      - name: Verify every digest and the talon binary
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          cd "$RUNNER_TEMP/assets"
          sha256sum -c checksums.txt
          for f in *.sha256; do sha256sum -c "$f"; done
          for required in "talon_${VERSION}_linux_amd64.tar.gz" "talon_${VERSION}_darwin_arm64.tar.gz" "talon_${VERSION}_darwin_amd64.tar.gz" \
                          "talon-openshell-showcase_${VERSION}_linux_amd64.tar.gz" "talon-openshell-showcase_${VERSION}_linux_amd64.manifest.json"; do
            [ -s "$required" ] || { echo "missing release asset: $required" >&2; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/talon" && tar -C "$RUNNER_TEMP/talon" -xzf "talon_${VERSION}_linux_amd64.tar.gz" talon
          [ "$("$RUNNER_TEMP/talon/talon" version | head -n1)" = "Talon $VERSION" ]
          MANIFEST="$RUNNER_TEMP/assets/talon-openshell-showcase_${VERSION}_linux_amd64.manifest.json"
          [ "$(jq -r '.artifacts.talon.sha256' "$MANIFEST")" = "$(sha256sum "$RUNNER_TEMP/talon/talon" | cut -d' ' -f1)" ] || { echo "manifest artifacts.talon.sha256 does not match the released binary" >&2; exit 1; }
          [ "$(jq -r '.agent_image' "$MANIFEST")" = "ghcr.io/dativo-io/talon-openshell-agent:${VERSION}" ]
          mkdir -p "$RUNNER_TEMP/customer" && tar -C "$RUNNER_TEMP/customer" -xzf "talon-openshell-showcase_${VERSION}_linux_amd64.tar.gz"
          cmp "$RUNNER_TEMP/customer/talon-openshell-showcase_${VERSION}_linux_amd64/showcase-manifest.json" "$MANIFEST"
          {
            echo "TALON_SHOWCASE_TALON_BIN=$RUNNER_TEMP/talon/talon"
            echo "TALON_SHOWCASE_BUNDLE_DIR=$RUNNER_TEMP/customer/talon-openshell-showcase_${VERSION}_linux_amd64"
            echo "TALON_SHOWCASE_RELEASE_MANIFEST=$MANIFEST"
          } >> "$GITHUB_ENV"
      - name: Log in to GHCR (the manifest's agent image, sandbox and supervisor images)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Cache OpenShell release tarballs (re-verified by sha256 on every run)
        uses: actions/cache@v4
        with:
          path: ~/.cache/talon-openshell
          key: openshell-v0.1.3-tarballs-${{ runner.arch }}
      - name: Customer path from the published artifacts (no checkout, no Go)
        env:
          TALON_SHOWCASE_KEEP: "1"
        run: |
          set -euo pipefail
          # The runner is the bundle's own copy; the checkout only supplied
          # release-guard.sh. PATH carries no talon and no go.
          cd "$RUNNER_TEMP"
          env -u GOROOT PATH="/usr/local/bin:/usr/bin:/bin" bash "$TALON_SHOWCASE_BUNDLE_DIR/demo.sh" validate 2>&1 | tee "$RUNNER_TEMP/showcase-validate.log"
      - name: Require the runner verdict
        if: always()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/showcase-validate.log"
          grep -q '^PASS validate:' "$RUNNER_TEMP/showcase-validate.log"
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/release-guard.sh "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json isDraft,url -q '"published: \(.url) draft=\(.isDraft)"'
      - name: Move the Docker latest and major.minor tags
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          case "$VERSION" in
            *-*) echo "pre-release $VERSION: latest and major.minor tags are not moved"; exit 0 ;;
          esac
          MAJOR_MINOR="${VERSION%.*}"
          docker buildx imagetools create \
            -t "ghcr.io/dativo-io/talon:latest" \
            -t "ghcr.io/dativo-io/talon:${MAJOR_MINOR}" \
            "ghcr.io/dativo-io/talon:${VERSION}"
          docker buildx imagetools inspect "ghcr.io/dativo-io/talon:latest" | head -n 5
      - name: Re-verify what the public downloads (no token)
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          mkdir -p "$RUNNER_TEMP/public" && cd "$RUNNER_TEMP/public"
          for f in checksums.txt "talon_${VERSION}_linux_amd64.tar.gz" \
                   "talon-openshell-showcase_${VERSION}_linux_amd64.tar.gz" \
                   "talon-openshell-showcase_${VERSION}_linux_amd64.manifest.json"; do
            curl -fsSL --retry 5 --retry-delay 5 -o "$f" "$BASE/$f"
            cmp "$f" "$RUNNER_TEMP/assets/$f"
          done
          echo "public assets match the verified draft assets"
      - name: Collect sanitized logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$RUNNER_TEMP/showcase-validate.log" artifacts/ 2>/dev/null || true
          for d in /tmp/talon-openshell-showcase.*; do
            [ -d "$d/logs" ] || continue
            dest="artifacts/$(basename "$d")"
            mkdir -p "$dest"
            find "$d/logs" -maxdepth 1 -type f \( -name '*.log' -o -name '*.jsonl' -o -name '*.txt' \) -exec cp {} "$dest/" \;
          done
          if grep -rqE 'PRIVATE KEY-----|Bearer ey|sk-openshell-injected-|talon_appr_cred_' artifacts; then
            echo "artifact hygiene violation: secret-shaped material in collected logs" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verify-${{ env.RELEASE_TAG }}
          path: artifacts
          if-no-files-found: ignore
