name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Stacked PRs (a feature branch targeting another feature branch) run the
    # same gates as PRs to main; a branch is not "green" until this ran on it.
    branches: [main, 'feat/**', 'fix/**']
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.10']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # All test tiers: unit (internal + cmd), integration (tests/integration), e2e (tests/e2e)
      # Coverage: exclude cmd/talon (main) and internal/testutil (test helpers); threshold 65% (goal 70%)
      - name: Run unit tests
        run: go test -race -coverprofile=coverage-${{ matrix.go-version }}.out $(go list ./internal/... ./cmd/... | grep -v internal/testutil | grep -v internal/llm/testutil | grep -v 'cmd/talon')

      - name: Validate PII benchmark baseline artifacts
        run: |
          set -euo pipefail
          for f in testdata/benchmarks/pii_scan_baseline.*.json; do
            jq -e '.benchmark and .baseline_ns_per_op and .threshold_percent' "$f" >/dev/null
            echo "ok: $f"
          done

      - name: PII scan benchmark regression (linux/amd64)
        run: make benchmark-regression

      - name: Run integration tests
        run: go test -race -tags=integration ./tests/integration/...

      - name: Run repository guard tests
        run: go test ./tests

      - name: Run e2e tests
        run: go test -tags=e2e -timeout 5m ./tests/e2e/...

      - name: MCP governance-contract smoke (#372, offline, no keys)
        # Named PR gate for the governance extension's truth semantics:
        # committed signed evidence, forbidden action, protocol errors and an
        # ambiguous effect against the built binary. make test-smoke needs a
        # provider key and is not an ordinary-PR gate; this target is.
        run: make test-mcp-governance-smoke

      - name: Action Gateway smoke (#458/#425, offline, no keys)
        # Named PR gate for the exact governed-action spine and the company
        # action policy: DENY = 0 dispatch, approval = 0 until a reviewer
        # decides, exactly one dispatch, one company rule over two use cases,
        # stale approval invalidated across a restart, lifecycle verified —
        # against the built binary with a counting mock downstream.
        run: make test-action-smoke

      - name: Operations-console read-contract smoke (#535, offline, no keys)
        # Named PR gate for CLI/console parity on a live store: the console
        # read model, opened read-only on the store a running
        # `talon serve --gateway` writes, must show the same counters, spend,
        # caps, session summary and timeline as the CLI's --json output,
        # across a restart of the data plane and after it stops; `talon
        # metrics` must fail loudly without the admin key or server instead
        # of falling back to local numbers.
        run: make test-console-smoke

      - name: OpenShell composition smoke (#482/#457, fixture supervisor, no keys, no Docker)
        # Named PR gate for the Talon ↔ OpenShell composition: the fixture
        # supervisor replays the pinned middleware contract against the built
        # binary — governed model channel, sandbox → Action Gateway channel
        # through the hop assertion (allow / deny / human approval / replay /
        # forged identity), and response governance (actual usage settled,
        # PII transformed before delivery). The real-runtime proof is the
        # separate OpenShell Live workflow (Docker).
        run: make test-openshell-smoke

      - name: OpenShell showcase runner contract (#482, offline, no Docker)
        # The canonical customer runner's vocabulary, the Full Demo embedded
        # contract's refusals, and a standalone prepare validated by Talon's
        # loaders and doctor. The real-runtime run is the OpenShell Live
        # workflow's showcase job.
        run: make test-openshell-showcase-contract

      - name: Published-artifact path, failure injection (#359, offline, no Docker)
        # scripts/verify-release.sh and scripts/install.sh against a fake
        # release served from 127.0.0.1 and built like the real one: an
        # altered binary, a modified or missing manifest digest, a version or
        # commit mismatch, a private image and a draft must all fail closed.
        # The real published release is verified by `release.yml` before
        # publication and by the manual `Install Smoke` workflow afterwards.
        run: make test-release-verify

      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage-${{ matrix.go-version }}.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 65" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 65% target"
            exit 1
          fi

      - name: Conformance count (evidence + policy paths)
        run: |
          set -o pipefail
          make conformance | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache the pinned OPA binary
        # Keyed on the installer script, so a version or digest bump misses
        # the cache; a cached binary is still digest- and version-verified by
        # the installer before it is trusted.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/opa-bin
          key: opa-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-opa.sh') }}

      - name: Install the pinned OPA (checksum-verified)
        # Replaces `curl -L .../releases/latest/download/... && chmod +x`:
        # that path executed an HTML 504 page as OPA on 2026-11-08. The
        # installer pins the version, fails on any non-2xx, retries with
        # backoff, verifies the release's SHA-256 and the reported version,
        # and installs atomically or not at all (scripts/install-opa.sh).
        run: |
          OPA_INSTALL_DIR="${{ runner.temp }}/opa-bin" scripts/install-opa.sh
          echo "${{ runner.temp }}/opa-bin" >> "$GITHUB_PATH"

      - name: OPA installer failure injection (HTML 504, truncated, checksum, version)
        run: make test-install-opa

      - name: OPA/Rego policy tests
        run: opa test internal/policy/rego/ -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go-version }}
          path: coverage-${{ matrix.go-version }}.out

      - name: Upload to Codecov
        if: matrix.go-version == '1.26.10'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage-1.26.10.out
          fail_ci_if_error: false

  proof-gates:
    name: Epic #112 proof gates
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Download dependencies
        run: go mod download

      - name: Run proof gates
        run: make proof-gates

  product-demo-smoke:
    name: Product demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Download dependencies
        run: go mod download

      # gum is a DEMO-ONLY dependency, pinned to v0.17.0. It is needed only by the
      # smoke's gum-dependency-boundary checks (hero-errors-without-gum, the
      # recorder-refuses-plain check) and NOT by Talon itself: it never enters
      # go.mod, the talon binary, or `make product-demo` / the verbose `all` cut.
      - name: Install gum (demo-only, pinned)
        run: go install github.com/charmbracelet/gum@v0.17.0

      # Runs examples/product-demo/demo.sh against the offline mock provider (no
      # API keys, no spend): validates startup, three-agent discovery, the
      # policy-valid-failover / org-tool / session-budget / blocked-fleet evidence
      # assertions, that those assertions are load-bearing (a NEGATIVE evidence
      # case fails the demo), and the gum dependency boundary (the `all` cut never
      # calls gum; `hero` errors clearly without gum; the recorder refuses plain).
      - name: Smoke-test the product demo (mock provider)
        run: PATH="$(go env GOPATH)/bin:$PATH" make smoke-product-demo

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 5m

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Lint every tracked shell script (#242): three shell-only demo bugs
      # (#239 #240 #241) shipped because CI never looked at *.sh. Config lives
      # in .shellcheckrc. The version is pinned: the runner's preinstalled
      # shellcheck emits SC2317 false positives on indirectly-invoked
      # functions that 0.11 correctly skips.
      - name: Install shellcheck
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Install cross-compilation tools
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
        run: |
          make build
          ls -lh bin/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: talon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/talon

  # Real browser against the PACKAGED console (#537): Chromium drives the
  # embedded shell served by `talon ui serve` from the built binary.
  browser:
    name: Browser (console pairing)
    # Pinned runner image: `npx playwright install --with-deps` only knows
    # the OS releases its Playwright version shipped with. ubuntu-latest
    # became 26.04 and 1.52.0 refuses to install Chromium there ("does not
    # support chromium on ubuntu26.04-x64"). Bump the runner image and the
    # @playwright/test pin in tests/browser/package.json together.
    runs-on: ubuntu-24.04
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build talon
        run: go build -o "$RUNNER_TEMP/talon" ./cmd/talon/
      - name: Install Playwright (pinned) and Chromium
        working-directory: tests/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Console pairing in a real browser
        working-directory: tests/browser
        env:
          TALON_BINARY: ${{ runner.temp }}/talon
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: tests/browser/test-results
          if-no-files-found: ignore

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t talon:ci .

      - name: Verify image size
        run: |
          SIZE=$(docker image inspect talon:ci --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Docker image size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 50 ]; then
            echo "::warning::Docker image ${SIZE_MB}MB exceeds 50MB target"
          fi

      - name: Test binary in container
        run: |
          docker run --rm talon:ci version
          docker run --rm talon:ci --help

      # The supported no-key Compose stack starts the read-only console as
      # its own service (#536, #537): loopback-only publication, pairing from
      # the container log, no privileged route through the console, reissue
      # from inside the container, restart independence.
      - name: Console Compose smoke (examples/docker-compose + talon-ui)
        run: bash scripts/console-compose-smoke.sh

      # The RELEASE image is a different Dockerfile: goreleaser-cross links
      # talon against glibc (CGO, go-sqlite3) and Dockerfile.goreleaser copies
      # that prebuilt binary onto its base. v1.16.0-rc.1 put it on alpine and
      # the released image could not exec it ("Run the released Docker image"
      # failed after every other gate had passed). Build the binary with a
      # glibc toolchain of the same Debian line and prove the release image
      # runs it, before a tag finds out.
      - name: Release image (Dockerfile.goreleaser) runs a glibc-linked talon
        run: |
          set -euo pipefail
          CTX="$RUNNER_TEMP/release-image"
          mkdir -p "$CTX"
          docker run --rm -v "$PWD:/src:ro" -v "$CTX:/out" -w /src \
            -e CGO_ENABLED=1 -e GOFLAGS=-buildvcs=false -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod \
            golang:1.26.10-bookworm \
            go build -trimpath -ldflags "-s -w -X github.com/dativo-io/talon/internal/cmd.Version=0.0.0-ci" -o /out/talon ./cmd/talon/
          file "$CTX/talon" | grep -q 'dynamically linked' || { echo "expected a glibc-linked binary like goreleaser's" >&2; exit 1; }
          cp Dockerfile.goreleaser "$CTX/"
          docker build -f "$CTX/Dockerfile.goreleaser" -t talon:release-ci "$CTX"
          [ "$(docker run --rm talon:release-ci version | head -n1)" = "Talon 0.0.0-ci" ]
