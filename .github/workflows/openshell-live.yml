# Real-OpenShell live lane (#482, #457): Talon as supervisor middleware of the
# released NVIDIA/OpenShell gateway and sandbox (docker driver), with a
# deterministic mock provider and a protected action target: model governance
# (cases A–F) and the sandbox → Action Gateway channel (cases G–M). Runs on
# changes to the code that can break the composition, on demand, and weekly.
# Ordinary unit CI never requires this privileged setup. The job is red
# whenever the harness is: the run step uses an explicit pipefail and a second
# step requires the harness's own ALL PASS line, so a broken pipeline can never
# show as success.
#
# Version matrix: v0.1.3 is the validated baseline and required. v0.1.4
# (released 2026-10-13; middleware proto identical but for a comment) is
# pinned and exercised as an experimental entry: its failure is reported but
# does not fail the workflow until it has been green once and is promoted.
name: OpenShell Live

on:
  workflow_dispatch:
    inputs:
      plumbing_selftest:
        description: "Run the harness in deliberate-failure mode to prove a failing harness yields a red job"
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "internal/openshell/**"
      - "internal/workload/**"
      - "internal/gateway/delegated.go"
      - "internal/gateway/delegated_hop.go"
      - "internal/gateway/decision.go"
      - "internal/gateway/config.go"
      - "internal/gateway/identity.go"
      - "internal/cmd/serve.go"
      - "internal/cmd/agent_bridge.go"
      - "internal/server/workload_hop.go"
      - "internal/server/server.go"
      - "internal/action/**"
      - "internal/policy/agent.talon.schema.json"
      - "scripts/openshell-live.sh"
      - "scripts/openshell-live-plumbing-check.sh"
      - "tests/openshell-live/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/openshell-live.yml"

permissions:
  contents: read
  packages: read

jobs:
  live:
    name: Talon + OpenShell ${{ matrix.openshell }} (docker driver${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - openshell: v0.1.3
            experimental: false
          - openshell: v0.1.4
            experimental: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Pipeline plumbing guard (a failing harness must be a failing job)
        run: |
          set -euo pipefail
          bash scripts/openshell-live-plumbing-check.sh
      - name: Mock provider and protected service regression tests (race)
        run: |
          # The harness's provider and action target are the boundaries every
          # case asserts on; a broken fixture must fail here, before any
          # Docker work.
          set -euo pipefail
          go test -race -count=1 ./tests/openshell-live/...
      - name: Runtime facts
        run: |
          set -euo pipefail
          docker version
          uname -r
          cat /sys/kernel/security/lsm || true
      - name: Log in to GHCR (sandbox and supervisor images)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Cache OpenShell release tarballs (re-verified by sha256 on every run)
        uses: actions/cache@v4
        with:
          path: ~/.cache/talon-openshell
          key: openshell-${{ matrix.openshell }}-tarballs-${{ runner.arch }}
      - name: Live smoke
        env:
          OPENSHELL_VERSION: ${{ matrix.openshell }}
          TALON_OPENSHELL_KEEP: "1"
          TALON_OPENSHELL_SELFTEST_FAIL: ${{ inputs.plumbing_selftest == true && '1' || '0' }}
        run: |
          # The harness's exit status is the job's status: explicit pipefail,
          # never a shell default.
          set -euo pipefail
          make test-openshell-live 2>&1 | tee openshell-live.log
      - name: Require the harness verdict
        if: always()
        run: |
          # Independent of the step above: success means the harness itself
          # printed its final verdict. A red Live smoke step already fails the
          # job; this guards the pipeline plumbing too.
          set -euo pipefail
          test -f openshell-live.log
          grep -q '^ALL PASS openshell live smoke' openshell-live.log
      - name: Collect sanitized logs
        if: always()
        run: |
          # Only the harness's log directory is collected; tls/, jwt/,
          # talon-home/ and provider-state.json stay on the runner. The harness
          # also asserts the logs carry no secret material before ALL PASS.
          set -euo pipefail
          mkdir -p artifacts
          cp openshell-live.log artifacts/ 2>/dev/null || true
          for d in /tmp/talon-openshell-live.*; do
            [ -d "$d/logs" ] || continue
            dest="artifacts/$(basename "$d")"
            mkdir -p "$dest"
            find "$d/logs" -maxdepth 1 -type f \( -name '*.log' -o -name '*.jsonl' -o -name '*.out' \) -exec cp {} "$dest/" \;
          done
          # Artifact hygiene: no private keys, no bearer tokens, no key material shapes.
          if grep -rqE 'PRIVATE KEY-----|Bearer ey|sk-live-openshell-injected-' artifacts; then
            echo "artifact hygiene violation: secret-shaped material in collected logs" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openshell-live-logs-${{ matrix.openshell }}
          path: artifacts
          if-no-files-found: ignore
