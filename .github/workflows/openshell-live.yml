# Real-OpenShell live lane (#482): Talon as supervisor middleware of the
# released NVIDIA/OpenShell v0.1.3 gateway and sandbox (docker driver), with a
# deterministic mock provider. Runs on changes to the OpenShell integration,
# on demand, and weekly. Ordinary unit CI never requires this privileged setup.
name: OpenShell Live

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "internal/openshell/**"
      - "internal/workload/**"
      - "internal/gateway/delegated.go"
      - "scripts/openshell-live.sh"
      - "tests/openshell-live/**"
      - ".github/workflows/openshell-live.yml"

permissions:
  contents: read
  packages: read

jobs:
  live:
    name: Talon + OpenShell v0.1.3 (docker driver)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Runtime facts
        run: |
          docker version
          uname -r
          cat /sys/kernel/security/lsm || true
      - name: Log in to GHCR (sandbox and supervisor images)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Cache OpenShell release artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/talon-openshell
          key: openshell-v0.1.3-${{ runner.arch }}
      - name: Live smoke
        env:
          TALON_OPENSHELL_KEEP: "1"
        run: make test-openshell-live 2>&1 | tee openshell-live.log
      - name: Collect logs
        if: always()
        run: |
          mkdir -p artifacts
          cp openshell-live.log artifacts/ 2>/dev/null || true
          for d in /tmp/talon-openshell-live.*; do [ -d "$d/logs" ] && cp -r "$d/logs" "artifacts/$(basename "$d")" || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openshell-live-logs
          path: artifacts
          if-no-files-found: ignore
