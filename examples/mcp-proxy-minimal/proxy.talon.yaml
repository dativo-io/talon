# Minimal MCP proxy config — audit vendor AI tool calls.
# Routes MCP traffic through Talon for PII scanning and evidence logging.
#
# Usage:
#   talon serve --port 8080 --proxy-config examples/mcp-proxy-minimal/proxy.talon.yaml
#
# Then point your vendor AI at: http://localhost:8080/mcp/proxy
proxy:
  upstream:
    vendor: generic
    url: "http://localhost:9091/mcp"

  # Talon-facing tool name -> vendor's upstream name.
  # Omit upstream_name when the names are identical.
  # header_params declares which primitive arguments the vendor mirrors into
  # Mcp-Param-* headers (MCP x-mcp-header); Talon validates them inbound and
  # generates them outbound from the authorized body. Protocol metadata only.
  allowed_tools:
    - name: ticket_search
      # header_params:
      #   region: Region
    - name: ticket_create
    - name: ticket_update
    - name: user_lookup

  forbidden_tools:
    - user_delete
    - bulk_export
    - "admin_*"

  rate_limits:
    requests_per_minute: 100

# Top-level block (NOT under proxy:) — redaction rules applied to PII
# found in tool arguments and upstream responses.
pii_handling:
  redaction_rules:
    - field: email
      method: hash
    - field: phone
      method: mask_middle
